# XcodeGen spec — the source of truth for the Xcode project.
# Regenerate after adding/removing files or targets:   cd apple && xcodegen
# KicksRide.xcodeproj is generated and gitignored.
name: KicksRide
options:
  bundleIdPrefix: com.mrjimcampbell
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  KicksCore:
    path: Packages/KicksCore

targets:
  KicksRide:
    type: application
    platform: iOS
    sources: [KicksRide]
    dependencies:
      - package: KicksCore
        products: [KicksCore, KicksFTMS, KicksLink, KicksRecording]
    info:
      path: KicksRide/Info.plist
      properties:
        CFBundleDisplayName: Virtual Trainer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSBluetoothAlwaysUsageDescription: Connects to your treadmill, bike and heart-rate strap.
        NSLocalNetworkUsageDescription: Sends your live run to the Apple TV display.
        NSBonjourServices: [_kicksride._tcp]
        # Keep the treadmill connection alive when the phone is locked / you're watching YouTube.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrjimcampbell.kicksride
        TARGETED_DEVICE_FAMILY: "1"

  KicksRideTV:
    type: application
    platform: tvOS
    sources:
      - path: KicksRideTV
        # Fog.metal needs Xcode's Metal Toolchain (xcodebuild -downloadComponent MetalToolchain);
        # until it's installed the app builds without it and runs without distance fog.
        excludes: ["Fog.metal"]
    dependencies:
      - package: KicksCore
        products: [KicksCore, KicksLink]
    info:
      path: KicksRideTV/Info.plist
      properties:
        CFBundleDisplayName: Virtual Trainer
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Receives your live run from the iPhone.
        NSBonjourServices: [_kicksride._tcp]
    postBuildScripts:
      # Copy gitignored built assets into the app (never committed):
      #  - the paid arena (tools/arena/build_arena.py), the .reality compiled for this platform
      #  - the runner clips (tools/runner/build_runner.py)
      #  - the look-dev skies (tools/sky/fetch_skies.sh, Poly Haven CC0)
      # Missing → the app falls back to a placeholder track / runner.
      - name: Copy built assets (if built)
        basedOnDependencyAnalysis: false
        script: |
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          ASSETS="${PROJECT_DIR}/../assets"
          SRC="$ASSETS/arena/build/arena-${PLATFORM_NAME}.reality"
          if [ -f "$SRC" ]; then cp "$SRC" "$RES/Arena.reality" && echo "Arena: copied $SRC"
          else rm -f "$RES/Arena.reality"; echo "warning: Arena not built - using placeholder track"; fi
          rm -f "$RES"/runner_*.usdz
          if ls "$ASSETS"/runner/build/runner_*.usdz >/dev/null 2>&1; then
            cp "$ASSETS"/runner/build/runner_*.usdz "$RES/" && echo "Runner: copied clips"
          else echo "warning: Runner not built - using placeholder box"; fi
          rm -f "$RES"/sky_*
          if ls "$ASSETS"/sky/build/sky_* >/dev/null 2>&1; then
            cp "$ASSETS"/sky/build/sky_* "$RES/" && echo "Sky: copied presets"
          else echo "warning: Skies not fetched (tools/sky/fetch_skies.sh) - default lighting"; fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrjimcampbell.kicksride.tv
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the arena copy reads from ../assets

schemes:
  KicksRide:
    build: { targets: { KicksRide: all } }
    run: { config: Debug }
  KicksRideTV:
    build: { targets: { KicksRideTV: all } }
    run: { config: Debug }
